<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- NVR Cyber Gradient (Mint -> Cyan -> Blue -> Purple) -->
    <linearGradient id="nvrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="35%" stop-color="#06b6d4" />
      <stop offset="70%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- REC Dot Glow -->
    <filter id="recGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Base (App Icon Squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Subtle PCB Circuit Background Lines -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 64 160 L 110 160 L 135 185" />
    <circle cx="64" cy="160" r="3" fill="#38bdf8" />
    
    <path d="M 448 160 L 402 160 L 377 185" />
    <circle cx="448" cy="160" r="3" fill="#38bdf8" />

    <path d="M 64 310 L 120 310 L 140 290" />
    <circle cx="64" cy="310" r="3" fill="#38bdf8" />

    <path d="M 448 310 L 392 310 L 372 290" />
    <circle cx="448" cy="310" r="3" fill="#38bdf8" />
  </g>

  <!-- Main Hardware / Recorder Chassis -->
  <g filter="url(#neonGlow)">
    <!-- Rounded Outer Housing -->
    <rect x="96" y="90" width="320" height="230" rx="36" fill="none" stroke="url(#nvrGrad)" stroke-width="8" />

    <!-- Storage Bays / Server Trays on the Left -->
    <g stroke="url(#nvrGrad)" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <line x1="126" y1="135" x2="160" y2="135" />
      <circle cx="172" cy="135" r="2.5" fill="#2dd4bf" />
      
      <line x1="126" y1="168" x2="160" y2="168" />
      <circle cx="172" cy="168" r="2.5" fill="#06b6d4" />
      
      <line x1="126" y1="201" x2="160" y2="201" />
      <circle cx="172" cy="201" r="2.5" fill="#3b82f6" />
      
      <line x1="126" y1="234" x2="160" y2="234" />
      <circle cx="172" cy="234" r="2.5" fill="#8b5cf6" />
      
      <line x1="126" y1="267" x2="160" y2="267" />
      <circle cx="172" cy="267" r="2.5" fill="#a855f7" />
    </g>

    <!-- Circuit Bus on the Right -->
    <g stroke="url(#nvrGrad)" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.85">
      <path d="M 345 170 L 375 170 L 390 185" />
      <circle cx="390" cy="185" r="3" fill="#06b6d4" />

      <path d="M 345 205 L 385 205" />
      <circle cx="385" cy="205" r="3" fill="#3b82f6" />

      <path d="M 345 240 L 375 240 L 390 225" />
      <circle cx="390" cy="225" r="3" fill="#8b5cf6" />
    </g>

    <!-- Glowing Red REC Indicator -->
    <circle cx="384" cy="126" r="10" fill="#f43f5e" filter="url(#recGlow)" />
    <circle cx="384" cy="126" r="5" fill="#fff" />

    <!-- Central Camera Lens & Iris Assembly -->
    <!-- Outer Lens Ring -->
    <circle cx="256" cy="205" r="62" fill="#020617" stroke="url(#nvrGrad)" stroke-width="7" />
    <circle cx="256" cy="205" r="50" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 6" opacity="0.6" />

    <!-- Aperture Blades -->
    <g stroke="url(#nvrGrad)" stroke-width="3.5" fill="none" stroke-linecap="round">
      <path d="M 256 160 L 278 186" />
      <path d="M 298 180 L 294 212" />
      <path d="M 294 228 L 268 244" />
      <path d="M 256 250 L 234 224" />
      <path d="M 214 230 L 218 198" />
      <path d="M 218 182 L 244 166" />
    </g>

    <!-- Inner Sensor Pupil -->
    <circle cx="256" cy="205" r="18" fill="#0f172a" stroke="url(#nvrGrad)" stroke-width="4" />
    <circle cx="256" cy="205" r="7" fill="#2dd4bf" />
  </g>

  <!-- Typography -->
  <text x="256" y="398" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, &#39;Helvetica Neue&#39;, sans-serif" font-size="28" font-weight="800" letter-spacing="4" fill="#f8fafc">
    BORING<tspan fill="#06b6d4">NVR</tspan>
  </text>
  <text x="256" y="428" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, &#39;Helvetica Neue&#39;, sans-serif" font-size="12" font-weight="600" letter-spacing="6" fill="#64748b">
    NETWORK VIDEO RECORDER
  </text>
</svg>
